services:
  - type: web
    name: superspeech-backend-frankfurt
    runtime: docker
    region: frankfurt
    plan: starter
    branch: frankfurt-migration
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_SUPERSPEECH_JOBS
        value: "false"
      - key: BACKEND_PUBLIC_URL
        value: https://api.superspeech.biz
      - key: TRADING_DASHBOARD_DOMAIN
        value: scalperbot-nath.duckdns.org
      - key: ENABLE_TRADING_FLEET
        value: "false"
      - key: TRADING_STATE_READY
        value: "false"
      - key: TRADING_STATE_IMPORT_ENABLED
        value: "false"
      - key: TRADING_STATE_DIR
        value: /data
      - key: KUCOIN_API_KEY
        sync: false
      - key: KUCOIN_API_SECRET
        sync: false
      - key: KUCOIN_API_PASSPHRASE
        sync: false
      - key: KUCOIN_API_KEY2
        sync: false
      - key: KUCOIN_API_SECRET2
        sync: false
      - key: KUCOIN_API_PASSPHRASE2
        sync: false
      - key: DASHBOARD_USER
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: TRADING_MIGRATION_TOKEN
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: superspeech-e7bde
      - key: FIREBASE_CLIENT_EMAIL
        value: firebase-adminsdk-fbsvc@superspeech-e7bde.iam.gserviceaccount.com
      - key: FIREBASE_DATABASE_URL
        value: https://superspeech-e7bde.firebaseapp.com
      - key: EMAIL_FROM
        value: hello@superspeech.biz
      - key: EMAIL_HOST
        value: spacemail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_SECURE
        value: false
      - key: EMAIL_USER
        value: hello@superspeech.biz
      - key: EMAIL_PASSWORD
        sync: false
      - key: OPENHANDS_API_KEY
        sync: false
      - key: OPENHANDS_API_URL
        value: https://api.openhands.com/v1
      - key: DASHBOARD_URL
        value: https://superspeech.biz/dashboard
      - key: API_SECRET_KEY
        sync: false
      # Everything below is managed in the Render dashboard - listed as
      # sync:false so blueprint syncs NEVER delete them again (2026-10-06
      # incident: API-triggered deploy wiped all social creds).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FIREBASE_CLIENT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: META_PAGE_TOKEN
        sync: false
      - key: FB_PAGE_ID
        sync: false
      - key: IG_USER_ID
        sync: false
      - key: THREADS_USER_ID
        sync: false
      - key: THREADS_ACCESS_TOKEN
        sync: false
      - key: MASTODON_INSTANCE
        sync: false
      - key: MASTODON_TOKEN
        sync: false
      - key: BSKY_HANDLE
        sync: false
      - key: BSKY_DID
        sync: false
      - key: BSKY_APP_PASSWORD
        sync: false
      - key: WQ_API_SECRET_KEY
        sync: false
      - key: WQ_APPROVER_EMAILS
        sync: false
      - key: WQ_EMAIL_FROM
        value: products@williamsquantum.com
      - key: WQ_EMAIL_FROM_NAME
        value: Williams Quantum
      - key: WQ_EMAIL_HOST
        value: mail.spacemail.com
      - key: WQ_EMAIL_PORT
        value: 587
      - key: WQ_EMAIL_SECURE
        value: "false"
      - key: WQ_EMAIL_USER
        sync: false
      - key: WQ_EMAIL_PASSWORD
        sync: false
      - key: WQ_IMAP_HOST
        value: mail.spacemail.com
      - key: WQ_IMAP_PORT
        value: 993
      - key: WQ_IMAP_POLL_INTERVAL_MS
        value: 120000
      - key: WQ_ENABLE_IMAP_POLLING
        value: "false"
      - key: WQ_ENABLE_AGENT
        value: "false"
      - key: WQ_STORE_FILE
        value: /data/wq-store.json
    healthCheckPath: /health
    autoDeployTrigger: "off"
    disk:
      name: superspeech-trading-state-frankfurt
      mountPath: /data
      sizeGB: 1
